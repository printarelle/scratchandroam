name: IndexNow
# After each push to main, tell Bing (and the other IndexNow engines) which pages changed.
# A page counts as changed when its date in src/lastmod.json changed (the build sets it from the page content).
on:
  push:
    branches: [main]
    paths: [src/lastmod.json]
  workflow_dispatch:
    inputs:
      all:
        description: "Submit every page, not only changed ones"
        type: boolean
        default: false
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Wait for Cloudflare to deploy
        run: sleep 180
      - name: Submit changed URLs
        env:
          ALL: ${{ inputs.all }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          site = "https://scratchandroam.com"
          key = open("src/indexnow-key.txt").read().strip()
          new = json.load(open("src/lastmod.json"))
          try:
              old = json.loads(subprocess.run(["git", "show", "HEAD~1:src/lastmod.json"], capture_output=True, text=True, check=True).stdout)
          except Exception:
              old = {}
          if os.environ.get("ALL") == "true":
              paths = sorted(new)
          else:
              paths = sorted(p for p, v in new.items() if old.get(p, {}).get("d") != v["d"])
          if not paths:
              print("No changed pages"); raise SystemExit(0)
          urls = [site + p for p in paths]
          body = json.dumps({"host": "scratchandroam.com", "key": key,
                             "keyLocation": f"{site}/{key}.txt", "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body,
                                       headers={"Content-Type": "application/json; charset=utf-8"})
          with urllib.request.urlopen(req, timeout=30) as r:
              print("IndexNow", r.status, "for", len(urls), "URLs")
          print("\n".join(urls))
          PY
